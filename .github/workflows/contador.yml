name: Contador diario de inventario $OPEN

on:
  schedule:
    # Opendoor refresca su sitemap sobre las 06:10 hora del Pacifico (13:10 UTC).
    # Corremos despues, y bastante antes del barrido de las 21:00 UTC.
    - cron: "37 14 * * *"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: contador
  cancel-in-progress: false

jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1 · Contar el inventario publicado (sitemap, fichas, empleo)
        run: python scripts/contar.py

      - name: 2 · Registros publicos de los condados y panel
        # Si un condado falla, no se pierde el recuento del paso 1.
        continue-on-error: true
        timeout-minutes: 60
        run: python scripts/registros.py

      - name: Guardar el resultado en el repositorio
        if: always()
        run: |
          git config user.name  "contador"
          git config user.email "contador@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Inventario y registros $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi

